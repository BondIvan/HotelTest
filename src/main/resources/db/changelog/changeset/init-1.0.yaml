databaseChangeLog:
  - changeSet:
      id: create-tables
      author: ivbo
      changes:
        - createTable:
            tableName: hotel

            # hotel table columns
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: brand
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # embedded Address object fields
              - column:
                  name: house_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: post_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              # embeded Contacts object fields
              - column:
                  name: phone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # embedded ArrivalTime object fields
              - column:
                  name: check_in
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: check_out
                  type: TIME

        - createTable:
            tableName: hotel_amenities

            # hotel_amenities table columns
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amenity
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        # forein key
        - addForeignKeyConstraint:
            baseTableName: hotel_amenities
            baseColumnNames: hotel_id
            constraintName: fk_hotel_amenities_hotel_id
            referencedTableName: hotel
            referencedColumnNames: id
            onDelete: CASCADE

        # constraint
        - addUniqueConstraint:
            tableName: hotel_amenities
            columnNames: hotel_id, amenity
            constraintName: uq_hotelid_amenity